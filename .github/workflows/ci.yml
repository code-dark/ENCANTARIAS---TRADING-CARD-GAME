# Verification. Runs on every push and every pull request, and publishes
# nothing — a red CI here means the code is broken, never that a deployment
# setting is missing.

name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref, so a rapid series of pushes
# only keeps the newest run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kept separate from the build so a failure says plainly whether the
      # problem is in the types or in the bundling.
      - name: Typecheck
        run: npx tsc --noEmit

      # The engine is the part worth protecting: the rules are pure functions
      # and the simulator depends on them staying that way.
      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
