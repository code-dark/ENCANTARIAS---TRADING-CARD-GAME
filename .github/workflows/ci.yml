name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref, so a rapid series of pushes
# only keeps the newest run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kept separate from the build so a failure says plainly whether the
      # problem is in the types or in the bundling.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run
