# Publishes the playable build to GitHub Pages.
#
# The slice is entirely client-side — no server, no API, no storage — so the
# whole game is the static bundle this produces. A tester opens the link and
# plays; nothing is installed and nothing else has to be hosted alongside it.

name: Pages

on:
  push:
    # The steady state once the work is merged, and the current branch so a
    # link exists for playtesting before that happens.
    branches: [main, claude/encantarias-cardgame-gkyzfd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway: a half-published
# site is worse than an outdated one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Publishing something that does not typecheck or whose tests fail would
      # hand testers a broken game and waste the session they gave us.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # Pages serves a project site from a subpath; vite.config.ts sets
      # `base: './'` so the bundle asks for its assets relatively and works
      # from wherever it lands.
      #
      # This step needs Pages already switched on for the repository, with its
      # source set to GitHub Actions. Creating the site from here was tried and
      # is not possible: the workflow token cannot do it —
      #   Create Pages site failed. Resource not accessible by integration
      # — because turning Pages on is a repository administration action, and
      # no automation is granted that. It is one switch, once, by a person with
      # admin on the repo; every deploy after it is automatic.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
